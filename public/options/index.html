    <title>ChatGPT 深度搜索设置</title>
  </head>
  <body>
    <main>
      <h1>ChatGPT 深度搜索</h1>
      <p>本扩展只在本机 IndexedDB 保存最近 200 条 ChatGPT 对话索引，不上传对话，不保存 Cookie 或访问令牌。</p>
      <p>重新构建后请在 Edge 扩展页点击“重新加载”，再刷新 ChatGPT。需要彻底清空索引时，请删除并重新加载扩展。</p>
    </main>
    <script src="index.js"></script>
  </body>
